<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- 背景 -->
  <rect x="0" y="0" width="300" height="200" fill="#fff1f0"/>
  
  <!-- 织物纹理 - 花纹 -->
  <pattern id="fabric-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="5" fill="none" stroke="#ffccc7" stroke-width="1"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="#ffccc7" stroke-width="1"/>
    <circle cx="0" cy="30" r="5" fill="none" stroke="#ffccc7" stroke-width="1"/>
    <circle cx="30" cy="0" r="5" fill="none" stroke="#ffccc7" stroke-width="1"/>
    <circle cx="30" cy="30" r="5" fill="none" stroke="#ffccc7" stroke-width="1"/>
  </pattern>
  
  <rect x="0" y="0" width="300" height="200" fill="url(#fabric-pattern)"/>
  
  <!-- 装饰花朵 -->
  <g transform="translate(75, 50)">
    <circle cx="0" cy="0" r="10" fill="#ff4d4f"/>
    <circle cx="0" cy="0" r="5" fill="#ffccc7"/>
  </g>
  
  <g transform="translate(225, 150)">
    <circle cx="0" cy="0" r="10" fill="#ff4d4f"/>
    <circle cx="0" cy="0" r="5" fill="#ffccc7"/>
  </g>
  
  <g transform="translate(150, 100)">
    <circle cx="0" cy="0" r="15" fill="#ff4d4f"/>
    <circle cx="0" cy="0" r="8" fill="#ffccc7"/>
  </g>
  
  <!-- 标题 -->
  <text x="150" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff4d4f" text-anchor="middle">红色丝绒花纹</text>
</svg> 
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- 背景矩形 -->
  <rect x="0" y="0" width="200" height="60" rx="10" ry="10" fill="#001529"/>
  
  <!-- 'Fabric' 部分 -->
  <text x="20" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#40a9ff">Fabric</text>
  
  <!-- 'Lens' 部分 -->
  <text x="90" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Lens</text>
  
  <!-- 镜头图案 -->
  <circle cx="170" cy="30" r="15" fill="none" stroke="#40a9ff" stroke-width="2"/>
  <circle cx="170" cy="30" r="5" fill="#40a9ff"/>
  <line x1="155" y1="30" x2="159" y2="30" stroke="#40a9ff" stroke-width="2"/>
  <line x1="181" y1="30" x2="185" y2="30" stroke="#40a9ff" stroke-width="2"/>
  <line x1="170" y1="15" x2="170" y2="19" stroke="#40a9ff" stroke-width="2"/>
  <line x1="170" y1="41" x2="170" y2="45" stroke="#40a9ff" stroke-width="2"/>
</svg> 